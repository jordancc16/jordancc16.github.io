<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Taipei Trails map thumbnail">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d4f"/>
      <stop offset="0.6" stop-color="#1c5a5a"/>
      <stop offset="1" stop-color="#3b6ea5"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ee"/>
      <stop offset="1" stop-color="#dbe7dd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#land)"/>

  <!-- rivers -->
  <path d="M-20 120 C 160 160, 240 300, 420 320 S 720 420, 840 380" fill="none" stroke="#9cc3e0" stroke-width="26" stroke-linecap="round" opacity="0.7"/>
  <path d="M420 320 C 500 250, 560 160, 640 60" fill="none" stroke="#9cc3e0" stroke-width="20" stroke-linecap="round" opacity="0.7"/>

  <!-- route lines -->
  <path d="M60 150 C 200 190, 280 320, 430 330 S 690 410, 760 370" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M430 330 C 500 260, 560 170, 630 80" fill="none" stroke="#c64034" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 380 C 250 360, 330 400, 410 360" fill="none" stroke="#d39614" stroke-width="7" stroke-linecap="round"/>

  <!-- pins -->
  <g>
    <circle cx="60" cy="150" r="12" fill="#2f7d4f" stroke="#fff" stroke-width="4"/>
    <circle cx="760" cy="370" r="12" fill="#2f7d4f" stroke="#fff" stroke-width="4"/>
    <circle cx="630" cy="80" r="12" fill="#c64034" stroke="#fff" stroke-width="4"/>
  </g>

  <!-- header band -->
  <rect x="0" y="0" width="800" height="70" fill="url(#sky)"/>
  <text x="28" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">🚲 Taipei Trails</text>

  <!-- badge -->
  <g transform="translate(560,410)">
    <rect x="0" y="0" width="210" height="52" rx="26" fill="#ffffff" opacity="0.95"/>
    <text x="24" y="33" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2a24">15 bike routes ★</text>
  </g>
</svg>
